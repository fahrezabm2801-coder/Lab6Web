<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar tugas sederhana (To-do List)</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
<section>
  <h2>Daftar Tugas</h2>
  <label for="inputTugas">Tugas baru</label>
  <input id="inputTugas" type="text">
  <button id="tambahTugas" type="button">Tambah</button>
  <p id="pesanTugas" aria-live="polite"></p>
  <ul id="daftarTugas"></ul>
</section>

  <script>
    const inputTugas = document.getElementById("inputTugas");
    const tambahTugas = document.getElementById("tambahTugas");
    const daftarTugas = document.getElementById("daftarTugas");
    const pesanTugas = document.getElementById("pesanTugas");

    tambahTugas.addEventListener("click", function () {
      const teks = inputTugas.value.trim();

      if (teks === "") {
        pesanTugas.textContent = "Tulis tugas terlebih dahulu.";
        return;
      }

    const item = document.createElement("li");
    const label = document.createElement("span");
    const selesai = document.createElement("button");
    const hapus = document.createElement("button");

    // Membuat teks tugas
    label.textContent = teks + " ";

    // Tombol selesai
    selesai.type = "button";
    selesai.textContent = "Tandai selesai";

    selesai.addEventListener("click", function () {
      item.classList.toggle("selesai");

      selesai.textContent = item.classList.contains("selesai")
        ? "Batalkan selesai"
        : "Tandai selesai";
    });

    // Tombol hapus
    hapus.type = "button";
    hapus.textContent = "Hapus";

    hapus.addEventListener("click", function () {
      item.remove();
      pesanTugas.textContent = "Tugas berhasil dihapus.";
    });

    // Memasukkan elemen ke dalam daftar
    item.append(label, selesai, hapus);
    daftarTugas.appendChild(item);

    inputTugas.value = "";
    pesanTugas.textContent = "Tugas ditambahkan.";
    inputTugas.focus();
  });
  </script>
</body>
</html>
