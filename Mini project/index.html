<!DOCTYPE html>
<html lang="id">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Praktikum DOM dan Event</title>
 <link rel="stylesheet" href="./style.css">
</head>
<body>
 <div class="container">
    <h1>Pendaftaran Workshop</h1>
    <p>Silakan isi formulir pendaftaran di bawah ini.</p>
        <form id="formPendaftaran" novalidate>
          <label for="nama">Nama Lengkap</label>
          <input type="text" id="nama" placeholder="Masukkan nama lengkap">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="Masukkan email">
          <label for="sesi">Pilih Sesi Workshop</label>
            <select id="sesi">
                <option value="">-- Pilih Sesi --</option>
                <option value="Sesi Pagi">Sesi Pagi (09.00 - 12.00)</option>
                <option value="Sesi Siang">Sesi Siang (13.00 - 16.00)</option>
            </select>
          <p id="jumlahKarakter">Jumlah karakter nama: 0</p>

          <div class="tombol">
           <button type="submit">Daftar</button>
            <button type="reset" id="resetForm">Reset</button>
          </div>
        </form>

        <div id="pesan"></div>
        <div class="ringkasan">
            <h2>Ringkasan Pendaftaran</h2>
            <p>Nama: <span id="hasilNama">-</span></p>
            <p>Email: <span id="hasilEmail">-</span></p>
            <p>Sesi: <span id="hasilSesi">-</span></p>
        </div>

    </div>

<script src="./script.js"></script>
</body>
</html>
